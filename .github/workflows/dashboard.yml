name: Refresh and publish WCQ dashboard
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, deleted, assigned, unassigned]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: wcq-dashboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh task snapshot
        run: node scripts/sync-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check JavaScript
        run: npm run check
      - name: Check task field mapping
        run: npm test
      - name: Preserve dashboard for private review
        uses: actions/upload-artifact@v4
        with:
          name: wcq-dashboard
          path: docs
      - name: Configure Pages
        if: github.event.repository.private == false
        uses: actions/configure-pages@v5
      - name: Upload Pages
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event.repository.private == false
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
